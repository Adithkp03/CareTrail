# Render Blueprint: one-click deploy of the CareTrail backend + free Postgres.
# Deploy: https://dashboard.render.com/blueprint/new?repo=https://github.com/Adithkp03/CareTrail
services:
  - type: web
    name: caretrail-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caretrail-db
          property: connectionString
      - key: SARVAM_API_KEY
        sync: false   # fill in the Render dashboard when you have it
      - key: GEMINI_API_KEY
        sync: false
      - key: TOKEN_TTL_DAYS
        value: "30"

databases:
  - name: caretrail-db
    plan: free
    databaseName: caretrail
