# Review-branch verification for the native Android app: compiles, runs JVM unit
# tests, and builds the debug APK. Branch-scoped on purpose: no deploy, no
# secrets, no production effect. (Roborazzi screenshot step lives on the
# fix/reminder-gaps branch, which owns the dose-card UI change.)
name: Native Android build (review)

on:
  workflow_dispatch:
  push:
    branches: [feat/google-sign-in]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and debug APK
        working-directory: android-native
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: native-build
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
