name: Keyboard proof (emulator)

# On-device proof that the chat composer stays visible above the soft keyboard
# (Roborazzi static renders cannot show the IME). Review-branch only.

on:
  workflow_dispatch:
  push:
    branches: [feat/ui-redesign]

jobs:
  keyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Chat composer keyboard test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # The emulator dies when this action ends, so the screenshot pull must
          # happen inside this script, not in a later step.
          # android-emulator-runner executes each script line in its own sh -c,
          # so cd and variables do not persist across lines: keep it one line.
          script: >-
            gradle -p android-native :app:connectedDebugAndroidTest -PcaretrailSupabaseAnonKey=ci-screenshot-dummy --no-daemon --console=plain;
            TEST_STATUS=$?;
            mkdir -p keyboard-shots;
            adb shell 'ls -la /sdcard/Pictures/ 2>&1 | tail -5' || true;
            adb pull /sdcard/Pictures/chat-keyboard-open.png keyboard-shots/ || true;
            [ -s keyboard-shots/chat-keyboard-open.png ] || adb exec-out cat /sdcard/Pictures/chat-keyboard-open.png > keyboard-shots/chat-keyboard-open.png 2>/dev/null || true;
            [ -s keyboard-shots/chat-keyboard-open.png ] || rm -f keyboard-shots/chat-keyboard-open.png;
            ls -laR keyboard-shots;
            exit $TEST_STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-proof
          path: keyboard-shots/
