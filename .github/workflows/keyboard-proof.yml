name: Keyboard proof (emulator)

# On-device proof that the chat composer stays visible above the soft keyboard
# (Roborazzi static renders cannot show the IME). Review-branch only.

on:
  workflow_dispatch:
  push:
    branches: [feat/ui-redesign]

jobs:
  keyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Chat composer keyboard test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: cd android-native && gradle :app:connectedDebugAndroidTest -PcaretrailSupabaseAnonKey=ci-screenshot-dummy --no-daemon --console=plain

      - name: Pull keyboard screenshots
        if: always()
        run: |
          mkdir -p keyboard-shots
          adb pull /sdcard/Android/data/com.caretrail.native/files/ keyboard-shots/ || true
          ls -la keyboard-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-proof
          path: keyboard-shots/
