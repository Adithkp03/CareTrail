name: Android APK (debug)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The API URL is baked into the APK at build time. Set the repo variable
      # APK_API_URL (Settings > Secrets and variables > Actions > Variables) to a
      # backend the phone can reach - a hosted URL, or your laptop's LAN IP while
      # testing at home (e.g. http://192.168.1.20:8000). localhost will not work
      # from a phone.
      - name: Build web app and sync into the Android shell
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.APK_API_URL || 'http://localhost:8000' }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: caretrail-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
