name: Demo record v3 (isolated scene jobs)

# One scene-group per matrix job: cold boot, prebuilt APK, demo login, short
# dump/source-verified navigation, record, upload artifacts with if: always().
# A miss costs one job. Scenes chosen via the `scenes` input after run-v2
# artifact review - no automatic rerun of all groups.

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: 'Comma-separated jobs: signup,timeline,upload_attention,assistant,reminders,facilities,profile,birth_baby,wellness,mindful,vault (empty = all)'
        required: false
        default: ''

env:
  COMMUNITY_LAUNCH: '1'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          scenes="${{ github.event.inputs.scenes }}"
          if [ -z "$scenes" ]; then scenes="upload_attention,vault,facilities,profile_datasafety"; fi
          json=$(echo "$scenes" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";""))' | jq -c '{job: .}')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Allow cleartext to the isolated emulator backend (recording-ops patch, same as v1/v2 harness)
        run: sed -i 's/usesCleartextTraffic="false"/usesCleartextTraffic="true"/' android-native/app/src/main/AndroidManifest.xml
      - name: Build TEST debug APK once (isolated backend, no production keys)
        run: gradle -p android-native assembleDebug --no-daemon -PcaretrailTestVariant=true -PcaretrailApi=http://10.0.2.2:8000
      - uses: actions/upload-artifact@v4
        with:
          name: caretrail-test-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  record:
    needs: [setup, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 22            # whole-job budget: ~4-6 min setup (checkout, APK
                                   # download, pip, KVM) + 10 min recording step (boots
                                   # the emulator inside it) + ~3 min artifact upload.
                                   # Step timeout alone cannot reserve uploader time.
    strategy:
      fail-fast: false
      max-parallel: 4              # bounded concurrency; APK built once in `apk`
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt APK
        uses: actions/download-artifact@v4
        with:
          name: caretrail-test-apk
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start isolated backend on :8000
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend-${{ matrix.job }}.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health >/dev/null && exit 0; sleep 2; done
          echo "backend failed to start"; exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record scene ${{ matrix.job }}
        id: record
        timeout-minutes: 10        # ends with >=8 min of job budget left for upload
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # android-emulator-runner executes each script line in its own sh -c:
          # keep it one line. Artifacts land in /tmp/demo-out on the runner.
          script: CARETRAIL_APK=app-debug.apk CARETRAIL_SAMPLE=backend/app/sample_reports/cbc_malayalam_low_hb.txt python3 .github/demo/driver_scene_v3.py ${{ matrix.job }}

      - name: Upload artifacts
        if: always()               # partial results, dumps and log survive a recording failure
        uses: actions/upload-artifact@v4
        with:
          name: demo-v3-${{ matrix.job }}
          path: |
            /tmp/demo-out/
            /tmp/backend-${{ matrix.job }}.log
          retention-days: 7
