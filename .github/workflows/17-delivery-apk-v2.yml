# Delivery build for the merged reminder work on main: compiles, runs JVM unit
# tests, and builds the debug APK signed with the repo-secret debug keystore
# (ANDROID_DEBUG_KEYSTORE_BASE64) so this APK installs over the Nov 20 delivered
# debug build with the same signing identity. Branch-scoped on purpose: no
# deploy, no production effect. The secret value never appears in logs or
# artifacts, only the public SHA-1 cert metadata. The APK artifact is delivered
# to Drive for real-device testing.
name: Native Android APK (delivery)

on:
  workflow_dispatch:
  push:
    branches: [delivery/reminder-apk]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Restore the stable debug keystore from the encrypted repo secret so this
      # APK signs with the same identity as the delivered Nov 20 debug build.
      # The key material never prints; the SHA-1 fingerprint is public cert
      # metadata (visible in any signed APK).
      - name: Restore stable debug keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Unit tests and debug APK
        working-directory: android-native
        # Injected signing properties make the debug APK use the restored stable
        # keystore deterministically (the AGP default path did not take in CI).
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug -Pcaretrail.skipScreenshotTest --no-daemon --console=plain \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      # Fail the build if the APK is not signed with the stable Nov-20 identity
      # (SHA-256 of a signing cert is public metadata, printed in CI logs).
      - name: Verify APK signing identity
        run: |
          APK=android-native/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -q 'E9:37:18:40:69:75:BF:0E:18:A2:C9:F0:01:CB:6F:EC:E3:E1:AE:AE:F9:A6:DD:61:08:6A:16:7F:DD:EF:08:64'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-core
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/reports/tests/
            android-native/app/build/test-results/testDebugUnitTest/

