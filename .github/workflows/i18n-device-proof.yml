name: i18n device proof (emulator)

# Device-level proof that the branch build renders runtime-FETCHED translations:
# real APK, real production backend, live /i18n/translate fetch, system screencaps
# plus a dump-extracted render matrix per language state. Review-branch only.

on:
  workflow_dispatch:
  push:
    branches: [feat/ui-redesign]

jobs:
  i18n-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetched-translation device proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # android-emulator-runner executes each script line in its own sh -c,
          # so cd and variables do not persist across lines: keep it one line.
          # The emulator dies with this action, so the artifact pull happens here.
          script: >-
            gradle -p android-native :app:assembleDebug -PcaretrailSupabaseAnonKey=ci-screenshot-dummy --no-daemon --console=plain;
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk;
            python3 .github/demo/i18n_driver.py;
            DRIVER_STATUS=$?;
            mkdir -p i18n-device-proof;
            cp /tmp/i18n-out/* i18n-device-proof/ 2>/dev/null || true;
            ls -laR i18n-device-proof;
            exit $DRIVER_STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i18n-device-proof
          path: i18n-device-proof/
