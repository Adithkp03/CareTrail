# Demo-only: records the native Android patient flow on a live emulator against an
# ISOLATED throwaway backend started on this runner (synthetic data, SQLite, never
# production). Branch-scoped, no deploy, no secrets. The cleartext flag is patched
# into the CI build only and is never committed.
name: Emulator demo recording

on:
  push:
    branches: [demo/emulator-recording]
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start isolated synthetic backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -s -X POST localhost:8000/demo/seed
          printf 'Doctor-Demo-2026\n' | python -m scripts.provision_clinician --email dr.demo@example.org --name 'Dr. Demo (synthetic)'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build test-variant APK pointing at the isolated backend
        working-directory: android-native
        run: |
          sed -i 's/usesCleartextTraffic="false"/usesCleartextTraffic="true"/' app/src/main/AndroidManifest.xml
          gradle :app:assembleDebug -Pcaretrail.skipScreenshotTest -PcaretrailTestVariant=true -PcaretrailApi=http://10.0.2.2:8000 --no-daemon --console=plain
          ls -l app/build/outputs/apk/debug/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record the flow on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 .github/demo/driver.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-demo-recording
          path: |
            /tmp/demo-out/
            /tmp/backend.log
          if-no-files-found: warn
